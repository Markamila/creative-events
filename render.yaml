# Render Blueprint: Dashboard → New → Blueprint → выберите репозиторий.
# Создаст веб-сервис из Dockerfile и базу PostgreSQL, свяжет их.
databases:
  - name: creative-events-db
    databaseName: creative_events
    user: creative
    plan: free            # для боевого сайта выберите платный тариф: на free база может быть удалена через время

services:
  - type: web
    name: creative-events
    runtime: docker
    plan: free            # на free сервис «засыпает» без трафика; для бизнеса — starter и выше
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: creative-events-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false       # Render спросит значение при создании
      - key: PUBLIC_URL
        sync: false       # например https://creative-events.onrender.com
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: MANAGER_EMAIL
        sync: false
